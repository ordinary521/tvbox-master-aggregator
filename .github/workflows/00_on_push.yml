name: 00_推送代码后连环全流程自动任务链

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # 每天固定自动运行 1 次 (北京时间 10:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.11 环境
        uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt lxml requests tldextract urllib3

      - name: 1:1 安装 Mihomo 官方原装 CLI 编译器进程
        run: |
          mkdir -p bin
          curl -sSL https://github.com/MetaCubeX/mihomo/releases/download/v1.18.10/mihomo-linux-amd64-v1.18.10.gz | gzip -d > bin/mihomo
          chmod +x bin/mihomo
          sudo mv bin/mihomo /usr/local/bin/mihomo
          mihomo -v || true

      - name: 克隆依赖仓库 (含 blackmatrix7 官方权威规则库)
        run: |
          mkdir -p repos
          git clone --depth 1 https://github.com/jie20091116/cat.git repos/cat || true
          git clone --depth 1 https://github.com/qist/tvbox.git repos/qist || true
          git clone --depth 1 https://github.com/blackmatrix7/ios_rule_script.git repos/blackmatrix7 || true

      - name: 运行 01号纯净分类合并器 (0 联网发包)
        run: python3 scripts/merge_sources.py

      - name: 运行 07号强力语法净化器
        run: python3 scripts/sanitize_extracted_domains.py

      - name: 运行 08号离线纯内存路由分类器 (0 网络发包)
        run: python3 scripts/classify_offline_domains.py

      - name: 运行 10号策略导出器 (强行擦除旧文件并调用 CRThu/clash-rules-mrs 官方命令打包全新 .mrs)
        run: python3 scripts/export_router_rules.py

      - name: 提交并推送最新构建结果
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A || true
          git commit -m "auto: 100% 强行清空旧文件并产出全新 Mihomo .mrs 二进制规则集 [$(date -u '+%Y-%m-%d %H:%M:%S')]" || true
          git pull --rebase origin main || true
          git push origin HEAD:main --force
